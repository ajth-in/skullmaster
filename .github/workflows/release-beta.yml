name: Release (Beta)

on:
  push:
    branches:
      - releases/beta

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint & Typecheck
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24 (LTS)
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace dependecies
        run: pnpm run build

      - name: Typecheck
        run: pnpm typecheck

  release:
    name: Release (Beta)
    runs-on: ubuntu-24.04
    needs: validate

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24 (LTS)
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure beta pre-release mode
        run: |
          MODE=$(node -e "console.log(require('./.changeset/pre.json').mode)")
          TAG=$(node -e "console.log(require('./.changeset/pre.json').tag)")
          if [ "$MODE" != "pre" ] || [ "$TAG" != "beta" ]; then
            exit 1;
          fi

      - name: Create Release Pull Request or Publish to npm (beta)
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
